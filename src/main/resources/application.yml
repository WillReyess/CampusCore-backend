server:
  port: ${SERVER_PORT:8080}

spring:
  config:
    import: optional:file:.env[.properties]

  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/campuscore}
    username: ${DB_USERNAME:campuscore}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    defer-datasource-initialization: true
    hibernate:
      ddl-auto: ${DDL_AUTO:update} # En desarrollo usa DDL_AUTO=update; en producción validate/none
    show-sql: ${SHOW_SQL:false}
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: ${SHOW_SQL:false}
        jdbc:
          time_zone: UTC

  sql:
    init:
      mode: always

jwt:
  secret: ${JWT_SECRET}
  expiration: ${JWT_EXPIRATION}

superadmin:
  email: ${SUPERADMIN_EMAIL}
  nombre: ${SUPERADMIN_NAME}
  apellido: ${SUPERADMIN_LASTNAME}
  password: ${SUPERADMIN_PASSWORD}
